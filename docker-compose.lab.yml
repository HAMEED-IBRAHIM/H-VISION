version: "3.8"

services:
  target_app:
    build:
      context: .
      dockerfile: target_app/Dockerfile
    container_name: hvision_target_lab
    ports:
      - "8001:8001"
    environment:
      - API_URL=http://api:8000
      - VULNERABLE_ENABLED=true
      - PORT=8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
