<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="H-VISION — Enterprise Autonomous SOC Platform." />
    <meta name="theme-color" content="#0d1117" />
    <title>H-VISION | Security Operations Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { font-size: 14px; }
      body {
        margin: 0;
        background: #0d1117;
        color: #e6edf3;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #484f58; }
      /* Enterprise table styles */
      .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .data-table th {
        background: #161b22;
        color: #8b949e;
        font-weight: 500;
        text-align: left;
        padding: 8px 16px;
        border-bottom: 1px solid #30363d;
        white-space: nowrap;
        letter-spacing: 0.01em;
      }
      .data-table td {
        padding: 10px 16px;
        border-bottom: 1px solid #21262d;
        color: #c9d1d9;
        vertical-align: middle;
      }
      .data-table tr:hover td { background: #161b22; }
      .data-table tr:last-child td { border-bottom: none; }
      /* Status chips */
      .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; white-space: nowrap; }
      .chip-red    { background: rgba(248,81,73,0.15);  color: #f85149; }
      .chip-orange { background: rgba(210,153,34,0.15); color: #d29922; }
      .chip-green  { background: rgba(63,185,80,0.15);  color: #3fb950; }
      .chip-blue   { background: rgba(31,111,235,0.15); color: #58a6ff; }
      .chip-grey   { background: rgba(139,148,158,0.15);color: #8b949e; }
      /* Section page header pattern */
      .page-section { padding: 0 0 20px 0; border-bottom: 1px solid #21262d; margin-bottom: 20px; }
      .page-section h2 { margin: 0 0 4px 0; font-size: 16px; font-weight: 600; color: #e6edf3; }
      .page-section p  { margin: 0; font-size: 13px; color: #8b949e; }
      /* Enterprise card */
      .ent-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; }
      .ent-card:hover { border-color: #484f58; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
