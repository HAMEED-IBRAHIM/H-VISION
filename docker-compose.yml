# ─────────────────────────────────────────────────────────────────
# JANUS-Sentinel — Complete Docker Compose
# Networks:
#   lab_network      → internal only (api, target_app, agents)
#   frontend_network → api + frontend
# ─────────────────────────────────────────────────────────────────

networks:
  lab_network:
    driver: bridge
    internal: true

  frontend_network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:

services:

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janus_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-janus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-januspass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-janus} -d ${POSTGRES_DB:-janus_sentinel}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── ChromaDB ─────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:0.5.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER: ""
      ANONYMIZED_TELEMETRY: "false"
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
    volumes:
      - chroma_data:/chroma/data
    networks:
      - lab_network
    ports:
      - "8002:8000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/heartbeat"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── JANUS-Sentinel API ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://janus:januspass@postgres:5432/janus_sentinel}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - lab_network
      - frontend_network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ─── Target Lab Application ───────────────────────────────────
  target_app:
    build:
      context: .
      dockerfile: target_app/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JANUS_API_URL: http://api:8000
      JANUS_TARGET_HOSTNAME: target_app
      VULNERABLE_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lab_network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8001/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── OWASP Juice Shop (Real Vulnerable App) ────────────────────
  juice-shop:
    image: bkimminich/juice-shop
    restart: unless-stopped
    networks:
      - lab_network
    ports:
      - "3000:3000"

  # ─── Blue Team Agent ──────────────────────────────────────────
  blue_agent:
    build:
      context: .
      dockerfile: agents/blue_agent/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JANUS_API_URL: http://api:8000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lab_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:9002/health', timeout=3)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Frontend (Vite / React) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend_network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:5173"
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Red Team Attack Agent ────────────────────────────────────
  red_agent:
    build:
      context: .
      dockerfile: agents/red_agent/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TARGET_URL: http://api:8000/proxy
      API_URL: http://api:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-service-token-change-in-prod}
      ATTACK_CYCLE_DELAY: "60"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lab_network